<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quality Department Guidelines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #1e3a8a;
        --secondary: #2563eb;
        --accent: #0284c7;
        --bg: #f1f5f9;
        --card-bg: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --highlight-bg: #e0f2fe;
        --border: #cbd5e1;
        --shadow: 0 10px 25px rgba(30, 58, 138, 0.12);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Cairo", "Segoe UI", sans-serif;
        line-height: 1.8;
      }

      a {
        color: var(--secondary);
      }

      .container {
        max-width: 980px;
        margin: 0 auto;
      }

      .banner {
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        color: #fff;
        text-align: center;
        padding: 28px 20px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 24px;
      }

      .banner h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        font-weight: 800;
      }

      .banner p {
        margin: 0;
        font-size: 1.1rem;
        opacity: 0.92;
      }

      .section {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.06);
        margin-bottom: 18px;
        overflow: hidden;
      }

      .section[open] {
        border-color: var(--secondary);
        box-shadow: 0 10px 18px rgba(37, 99, 235, 0.08);
      }

      .section summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 18px 24px;
        background: #fff;
        font-size: clamp(1.08rem, 1.8vw, 1.35rem);
        font-weight: 700;
        color: var(--primary);
        user-select: none;
        transition: background-color 0.2s ease;
      }

      .section summary:hover {
        background: #f8fafc;
      }

      .section summary::-webkit-details-marker {
        display: none;
      }

      .section summary::after {
        content: "❯";
        font-size: 1.1rem;
        color: var(--secondary);
        transform: rotate(90deg);
        transition: transform 0.25s ease;
      }

      .section[open] > summary::after {
        transform: rotate(270deg);
      }

      .section-content {
        padding: 20px 24px 24px;
        border-top: 1px solid #eef2f7;
      }

      .subsection {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 12px;
      }

      .subsection[open] {
        border-color: var(--secondary);
      }

      .subsection summary {
        padding: 14px 18px;
        font-size: 1.05rem;
        font-weight: 700;
        background: #fff;
        color: var(--primary);
      }

      .subsection .section-content {
        padding: 18px 20px 20px;
      }

      .svg-icon {
        display: inline-block;
        vertical-align: middle;
        margin-inline-start: 10px;
        flex-shrink: 0;
      }

      h2,
      h3,
      h4,
      p,
      ul,
      ol {
        margin-top: 0;
      }

      h3 {
        color: var(--primary);
        margin-bottom: 12px;
      }

      .highlight-box,
      .callout,
      .alert {
        background: var(--highlight-bg);
        border-inline-start: 4px solid var(--accent);
        border-radius: 10px;
        padding: 14px 16px;
        margin: 14px 0;
      }

      .chat-bubble {
        background: #0f172a;
        color: #f8fafc;
        border-inline-start: 4px solid #3b82f6;
        border-radius: 10px;
        padding: 12px 16px;
        margin: 10px 0;
      }

      .audio-player-mockup {
        background: #1e293b;
        padding: 12px 18px;
        border-radius: 25px;
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: 350px;
        margin: 12px 0;
        color: #fff;
        direction: ltr;
      }

      .play-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #3b82f6;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .waveform {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, #3b82f6 40%, #64748b 40%);
      }

      .ticket {
        background: #fef2f2;
        border: 1px solid #fca5a5;
        color: #7f1d1d;
        border-radius: 10px;
        padding: 16px;
        margin: 16px 0;
        font-family: sans-serif;
        direction: ltr;
        text-align: left;
      }

      .status-badge {
        display: inline-block;
        color: white;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        margin-inline-start: 6px;
      }

      .badge-urgent {
        background: #ef4444;
      }

      .badge-active {
        background: #8b5cf6;
      }

      .badge-reviewed {
        background: #8b5cf6;
      }

      .step-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .step-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 8px;
      }

      .step-item > div {
        flex: 1;
      }

      .step-number {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--secondary);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex-shrink: 0;
      }

      .team-tag {
        margin-inline-start: auto;
        background: #e2e8f0;
        color: #334155;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.84rem;
        font-weight: 700;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .tag .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
      }

      .tag-purple {
        background: #ede9fe;
        color: #6d28d9;
      }

      .tag-purple .dot {
        background: #6d28d9;
      }

      .tag-orange {
        background: #ffedd5;
        color: #c2410c;
      }

      .tag-orange .dot {
        background: #ea580c;
      }

      .tag-green {
        background: #dcfce7;
        color: #15803d;
      }

      .tag-green .dot {
        background: #16a34a;
      }

      .workflow-panel {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 18px 14px;
        overflow-x: auto;
        margin: 18px 0;
      }

      .workflow {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: max-content;
      }

      .card {
        width: 170px;
        min-height: 120px;
        background: #fafbfc;
        border: 1px dashed #d0d7de;
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card.active {
        border: 1.5px solid #6366f1;
        background: #fff;
      }

      .stop-title {
        font-size: 0.7rem;
        color: #94a3b8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .status-orange {
        color: #d97706;
      }

      .status-purple {
        color: #4f46e5;
      }

      .time-text {
        font-size: 0.72rem;
        color: #94a3b8;
      }

      .arrow {
        color: #cbd5e1;
        font-size: 1.2rem;
        user-select: none;
      }

      .excel-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #217346;
        color: #fff;
        padding: 6px 12px;
        border-radius: 8px;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }

      .excel-link:hover {
        background: #185c37;
      }

      .excel-link:focus-visible,
      .section summary:focus-visible,
      .subsection summary:focus-visible,
      a:focus-visible {
        outline: 3px solid #86efac;
        outline-offset: 3px;
      }

      .csc-btn-activate {
        display: inline-block;
        background: #4338ca;
        color: white;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }

      /* Active working state (green) for ACTIVATE */
      .csc-btn-activate.active-working {
        background: #16a34a !important; /* green */
        box-shadow: 0 6px 12px rgba(16, 185, 129, 0.12);
      }

      /* Inprogress / Done toggle button */
      .btn-inprogress {
        display: inline-block;
        background: #f59e0b; /* amber */
        color: white;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-inprogress.done {
        background: #10b981; /* emerald green */
      }

      .important {
        color: #b91c1c;
        font-weight: 700;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px;
        }

        .banner {
          padding: 22px 16px;
        }

        .section summary,
        .subsection summary {
          padding-inline: 16px;
        }

        .section-content,
        .subsection .section-content {
          padding-inline: 16px;
        }

        .step-item {
          align-items: flex-start;
          flex-wrap: wrap;
        }

        .team-tag {
          margin-inline-start: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header class="banner" aria-label="Header">
        <h1>Quality Department Guidelines</h1>
        <p>دليل إرشادات ومعايير عمل قسم الكواليتي</p>
      </header>

      <main>
        <details class="section" open>
          <summary>
            <span>
              <span aria-hidden="true">👨‍🏫🎓</span>
              خدمة اسأل مدرس
            </span>
          </summary>
          <div class="section-content">
            <!-- ... sections omitted for brevity (kept same as previous commit) ... -->

            <details class="subsection">
              <summary>
                <span>
                  <span class="csc-btn-activate" aria-hidden="true">▶ ACTIVATE</span>
                  &nbsp; مثال: زر ACTIVATE
                </span>
              </summary>
              <div class="section-content">
                <p>هذا مثال لزر ACTIVATE. عند النقر عليه سيتحول إلى "WORKING ON" باللون الأخضر. يمكن إعادته بالضغط مرة أخرى.</p>

                <!-- Example inprogress button -->
                <p>
                  <button type="button" class="btn-inprogress" aria-pressed="false">INPROGRESS</button>
                </p>
              </div>
            </details>

            <!-- rest of subsections retained as before -->
          </div>
        </details>

        <!-- other main sections kept as in previous commit -->

      </main>
    </div>

    <script>
      // Accessibility-friendly toggle helpers for ACTIVATE and INPROGRESS buttons
      (function () {
        // ACTIVATE toggle: .csc-btn-activate elements
        document.querySelectorAll('.csc-btn-activate').forEach(function (el) {
          // Make it keyboard-focusable and button-like
          el.setAttribute('role', 'button');
          el.setAttribute('tabindex', '0');
          if (!el.dataset.orig) el.dataset.orig = el.textContent.trim();
          el.setAttribute('aria-pressed', 'false');

          function setWorking(on) {
            if (on) {
              el.textContent = 'WORKING ON';
              el.classList.add('active-working');
              el.setAttribute('aria-pressed', 'true');
            } else {
              el.textContent = el.dataset.orig;
              el.classList.remove('active-working');
              el.setAttribute('aria-pressed', 'false');
            }
          }

          function toggle() {
            setWorking(el.getAttribute('aria-pressed') !== 'true');
          }

          el.addEventListener('click', function (e) {
            e.preventDefault();
            toggle();
          });

          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggle();
            }
          });
        });

        // INPROGRESS <-> DONE toggle: .btn-inprogress
        document.querySelectorAll('.btn-inprogress').forEach(function (btn) {
          btn.setAttribute('type', 'button');
          btn.setAttribute('aria-pressed', 'false');
          if (!btn.dataset.inprogress) btn.dataset.inprogress = 'INPROGRESS';
          if (!btn.dataset.done) btn.dataset.done = 'DONE';

          function setDone(on) {
            if (on) {
              btn.textContent = btn.dataset.done;
              btn.classList.add('done');
              btn.setAttribute('aria-pressed', 'true');
            } else {
              btn.textContent = btn.dataset.inprogress;
              btn.classList.remove('done');
              btn.setAttribute('aria-pressed', 'false');
            }
          }

          function toggle() {
            setDone(btn.getAttribute('aria-pressed') !== 'true');
          }

          btn.addEventListener('click', function (e) {
            e.preventDefault();
            toggle();
          });

          btn.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggle();
            }
          });
        });

        // If you want to persist state across reloads, you can extend this script
        // to save button states in localStorage and restore them on load.
      })();
    </script>
  </body>
</html>
